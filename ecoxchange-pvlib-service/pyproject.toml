[project]
name = "ecoxchange-pvlib-service"
version = "1.0.0"
description = "EcoXchange expected-generation microservice built on pvlib."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
