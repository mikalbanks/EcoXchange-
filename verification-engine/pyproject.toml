[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoxchange-verification-engine"
version = "2.0.0"
description = "EcoXchange production-verification engine (pvlib PVWatts ModelChain, P50/P90, loss waterfall, reconciliation)."
requires-python = ">=3.11"
dependencies = [
    "pvlib>=0.15",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# Only needed for the EIA fleet re-validation harness (.xlsx parsing).
fleet = ["openpyxl>=3.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["verification_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
