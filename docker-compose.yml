# EcoXchange full-stack orchestration.
#
# Brings up the three runtime services that make up the integration pipeline:
#   - pvlib-service      (3004) — expected-generation physics model
#   - irradiance-server  (3002) — NASA POWER satellite irradiance (MCP over HTTP)
#   - app                (8080) — Express API + React dashboard (the live app)
#
# Secrets come from a root `.env` (copy from `.env.example`). The Supabase write
# path activates automatically when SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY are
# present; otherwise the app runs in-memory.
services:
  pvlib-service:
    build: ./ecoxchange-pvlib-service
    ports:
      - "3004:3004"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  irradiance-server:
    build:
      context: ./ecoxchange-mcp
      dockerfile: packages/irradiance-mcp-server/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NASA_POWER_BASE_URL=https://power.larc.nasa.gov/api/temporal/daily/point
      - NREL_API_KEY=${NREL_API_KEY:-DEMO_KEY}
    restart: unless-stopped
    healthcheck:
      # node-alpine has no curl; use a tiny node fetch instead.
      test:
        ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      # Container DNS names — not localhost — for inter-service calls.
      - PVLIB_SERVICE_URL=http://pvlib-service:3004
      - IRRADIANCE_MCP_URL=http://irradiance-server:3002/mcp
    depends_on:
      pvlib-service:
        condition: service_healthy
      irradiance-server:
        condition: service_healthy
    restart: unless-stopped
