name: Production Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Optional 40-character main-branch commit SHA to release. Defaults to current main."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  RENDER_SERVICE_ID: srv-d8njcirbc2fs73f49gug
  RENDER_API_ORIGIN: https://ecoxchange-y6ah.onrender.com
  WWW_DEPLOYMENT_URL: https://www.ecoxchange.net/__deployment
  DEMO_DEPLOYMENT_URL: https://demo.ecoxchange.net/__deployment

jobs:
  release-context:
    name: Resolve release commit
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve exact release SHA
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            SHA="$WORKFLOW_SHA"
          elif [[ -n "${REQUESTED_SHA:-}" ]]; then
            SHA="$REQUESTED_SHA"
          else
            SHA="${GITHUB_SHA}"
          fi

          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Resolved release SHA is not a 40-character Git SHA: $SHA" >&2
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release SHA: $SHA"

      - name: Verify release SHA is on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch origin main --depth=200
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is not reachable from origin/main; refusing production release." >&2
            exit 1
          fi

  deploy-render:
    name: Deploy Render API
    needs: release-context
    runs-on: ubuntu-latest
    outputs:
      deploy_id: ${{ steps.render.outputs.deploy_id }}
    steps:
      - name: Require Render credential
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "Missing repository secret RENDER_API_KEY." >&2
            exit 1
          fi

      - name: Deploy or adopt exact Render commit
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SHA: ${{ needs.release-context.outputs.sha }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json")
          list_url="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=20"

          find_deploy() {
            curl -fsS "${auth[@]}" "$list_url" \
              | jq -r --arg sha "$SHA" '[.[] | select(.commit.id == $sha)][0].id // empty'
          }

          DEPLOY_ID="$(find_deploy)"
          if [[ -z "$DEPLOY_ID" ]]; then
            echo "No Render deployment exists yet for $SHA; triggering one."
            response="$(curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              --data '{"clearCache":"do_not_clear"}')"
            DEPLOY_ID="$(jq -r '.id // empty' <<<"$response")"
          else
            echo "Adopting existing Render deployment $DEPLOY_ID for $SHA."
          fi

          if [[ -z "$DEPLOY_ID" ]]; then
            echo "Could not resolve Render deployment id." >&2
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 60); do
            deploy="$(curl -fsS "${auth[@]}" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")"
            status="$(jq -r '.status' <<<"$deploy")"
            commit="$(jq -r '.commit.id // empty' <<<"$deploy")"
            echo "Render deploy $DEPLOY_ID: status=$status commit=$commit"

            if [[ -n "$commit" && "$commit" != "$SHA" ]]; then
              echo "Render deployment commit mismatch: expected $SHA, got $commit" >&2
              exit 1
            fi

            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Render deployment failed with status $status" >&2
                exit 1
                ;;
            esac

            if [[ "$attempt" == "60" ]]; then
              echo "Timed out waiting for Render deployment." >&2
              exit 1
            fi
            sleep 10
          done

          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${RENDER_API_ORIGIN}/api/health" >/dev/null
          echo "Render API is live and healthy for $SHA."

  deploy-www:
    name: Deploy www.ecoxchange.net
    needs: [release-context, deploy-render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: Build public website with release manifest
        env:
          WORKERS_CI_COMMIT_SHA: ${{ needs.release-context.outputs.sha }}
          WORKERS_CI_BRANCH: main
          WORKERS_CI: "1"
          WORKERS_CI_BUILD_UUID: github-${{ github.run_id }}-${{ github.run_attempt }}-www
        run: |
          npm ci
          npm run build

      - name: Deploy Cloudflare website worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Verify website release marker
        env:
          SHA: ${{ needs.release-context.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${WWW_DEPLOYMENT_URL}?release=${SHA}" || true)"
            deployed="$(jq -r '.commit // empty' <<<"$body" 2>/dev/null || true)"
            if [[ "$deployed" == "$SHA" ]]; then
              echo "www.ecoxchange.net is serving $SHA"
              exit 0
            fi
            echo "Waiting for website release marker; observed ${deployed:-none}."
            sleep 5
          done
          echo "Website did not report expected release SHA $SHA" >&2
          exit 1

  deploy-demo:
    name: Deploy demo.ecoxchange.net
    needs: [release-context, deploy-www]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecoxchange-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-context.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecoxchange-dashboard/package-lock.json

      - name: Build demo with release manifest
        env:
          WORKERS_CI_COMMIT_SHA: ${{ needs.release-context.outputs.sha }}
          WORKERS_CI_BRANCH: main
          WORKERS_CI: "1"
          WORKERS_CI_BUILD_UUID: github-${{ github.run_id }}-${{ github.run_attempt }}-demo
        run: |
          npm ci
          npm run build

      - name: Deploy Cloudflare demo worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Verify demo release marker
        env:
          SHA: ${{ needs.release-context.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "${DEMO_DEPLOYMENT_URL}?release=${SHA}" || true)"
            deployed="$(jq -r '.commit // empty' <<<"$body" 2>/dev/null || true)"
            if [[ "$deployed" == "$SHA" ]]; then
              echo "demo.ecoxchange.net is serving $SHA"
              exit 0
            fi
            echo "Waiting for demo release marker; observed ${deployed:-none}."
            sleep 5
          done
          echo "Demo did not report expected release SHA $SHA" >&2
          exit 1

  verify-production:
    name: Verify release equality
    needs: [release-context, deploy-render, deploy-www, deploy-demo]
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub, Render, website and demo agree
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SHA: ${{ needs.release-context.outputs.sha }}
          RENDER_DEPLOY_ID: ${{ needs.deploy-render.outputs.deploy_id }}
        run: |
          set -euo pipefail

          www="$(curl -fsS -H 'Cache-Control: no-cache' "${WWW_DEPLOYMENT_URL}?release=${SHA}")"
          demo="$(curl -fsS -H 'Cache-Control: no-cache' "${DEMO_DEPLOYMENT_URL}?release=${SHA}")"
          render="$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${RENDER_DEPLOY_ID}")"

          www_sha="$(jq -r '.commit // empty' <<<"$www")"
          demo_sha="$(jq -r '.commit // empty' <<<"$demo")"
          render_sha="$(jq -r '.commit.id // empty' <<<"$render")"
          render_status="$(jq -r '.status // empty' <<<"$render")"

          printf '%-22s %s\n' 'GitHub main release:' "$SHA"
          printf '%-22s %s (%s)\n' 'Render API:' "$render_sha" "$render_status"
          printf '%-22s %s\n' 'www.ecoxchange.net:' "$www_sha"
          printf '%-22s %s\n' 'demo.ecoxchange.net:' "$demo_sha"

          [[ "$render_status" == "live" ]]
          [[ "$render_sha" == "$SHA" ]]
          [[ "$www_sha" == "$SHA" ]]
          [[ "$demo_sha" == "$SHA" ]]

          curl -fsS --retry 5 --retry-delay 2 "${RENDER_API_ORIGIN}/api/health" >/dev/null
          curl -fsS --retry 5 --retry-delay 2 "https://demo.ecoxchange.net/bankability" >/dev/null
          curl -fsS --retry 5 --retry-delay 2 "https://www.ecoxchange.net/bankability" >/dev/null

          echo "Production release equality verified for $SHA."
