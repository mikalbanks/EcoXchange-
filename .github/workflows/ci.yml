name: CI

# Repository-wide regression guardrails. Network-dependent suites stay out so
# a red build represents a product regression rather than an upstream outage.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-engine:
    name: verification-engine (physics, time alignment, ingestion QC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: verification-engine/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: pytest
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q

  dashboard:
    name: dashboard (independence assertion)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecoxchange-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecoxchange-dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  reconciliation-engine:
    name: reconciliation-engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecoxchange-reconciliation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecoxchange-reconciliation-engine/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  project-finance:
    name: project-finance (isolated DB, golden, Ticket 09, contracts)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecoxchange_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecoxchange_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecoxchange_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Ticket 08 migration execution gate — clean isolated PostgreSQL
        run: npm run verify:finance:isolated-db
      - name: Ticket 08 static database contract gate
        run: npm run test:finance:db-schema
      - name: Ticket 09 deterministic underwriting policy engine
        run: npm run test:finance:ticket09
      - name: Ticket 07 golden reference gate
        run: npm run test:finance:golden
      - name: focused project-finance regression suite
        run: npx vitest run server/services/project-finance-engine

  app:
    name: app (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
