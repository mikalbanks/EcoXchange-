name: CI

# Repository-wide regression guardrails. Network-dependent suites stay out so
# a red build represents a product regression rather than an upstream outage.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-engine:
    name: verification-engine (physics, time alignment, ingestion QC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verification-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: verification-engine/requirements.txt
      - run: pip install -r requirements.txt pytest
      - name: pytest
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q

  dashboard:
    name: dashboard (independence assertion)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecoxchange-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecoxchange-dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  reconciliation-engine:
    name: reconciliation-engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecoxchange-reconciliation-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ecoxchange-reconciliation-engine/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  project-finance:
    name: project-finance (golden, policy, schema, API/AI contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: focused project-finance suite
        run: npx vitest run server/services/project-finance-engine client/src/pages/developer/project-finance-underwriting.test.tsx

  app:
    name: app (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
