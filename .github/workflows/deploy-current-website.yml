name: Deploy Current EcoXchange Website

on:
  push:
    branches: [ecoxchange-site-rebuild]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-current-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecoxchange-current-website-production
  cancel-in-progress: false

jobs:
  deploy-current-website:
    name: Build, test and deploy www EcoXchange
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and test only the current website
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run test:sites
          test -f dist/client/index.html
          grep -Rql 'site-scout' dist/client/assets
      - name: Require existing Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }
      - name: Deploy website Cloudflare Worker (not legacy root app)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --name ecoxchange
      - name: Verify public site serves the Site Scout release
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 4 --max-time 20 -H 'Cache-Control: no-cache' 'https://www.ecoxchange.net/site-scout' -o /tmp/site-scout.html
          asset="$(grep -oE 'src="/assets/[^\"]+\.js"' dist/client/index.html | head -n 1 | cut -d '"' -f 2)"
          test -n "$asset" || { echo 'Unable to locate built JavaScript asset'; exit 1; }
          curl -fsSL --retry 4 --retry-delay 4 --max-time 20 -H 'Cache-Control: no-cache' "https://www.ecoxchange.net${asset}" -o /tmp/site-scout-bundle.js
          cmp -s "dist/client${asset}" /tmp/site-scout-bundle.js || { echo 'Public domain is NOT serving latest Site Scout JavaScript; check Cloudflare route, DNS, or cache.'; exit 1; }
          echo 'PASS: www.ecoxchange.net/site-scout serves the exact current-site build asset.'

# This workflow intentionally does not touch root client/server, main, or ecoxchange1.
# It cannot replace browser/mobile map QA or a real user-authorized Turnstile/HubSpot inquiry.